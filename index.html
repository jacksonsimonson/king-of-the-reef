<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="King of the Reef, a fish-based tactical card roguelike."
    />
    <link rel="icon" type="image/svg+xml" href="/king-of-the-reef/favicon.svg" />
    <title>King of the Reef</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">Tactical card roguelike</p>
          <h1>King of the Reef</h1>
        </div>
        <nav class="site-nav" aria-label="Prototype views">
          <a class="nav-link" href="#play">Play</a>
          <a class="nav-link" href="#gallery">Gallery</a>
        </nav>
      </header>

      <section id="play" class="game-panel" aria-labelledby="prototype-heading">
        <div class="panel-copy">
          <p class="status">Playable battle build</p>
          <h2 id="prototype-heading">Build your school. Claim the reef.</h2>
          <p>
            Choose a fish, place it in open water, and use its single arrow to
            push other fish onto the three pearl reefs. Control the tide.
          </p>
        </div>
        <div id="game" aria-label="King of the Reef game canvas"></div>
      </section>

      <section id="gallery" class="gallery-panel" aria-labelledby="gallery-heading" hidden>
        <div class="gallery-heading-row">
          <div>
            <p class="status">School collection</p>
            <h2 id="gallery-heading">Fish Gallery</h2>
          </div>
          <a class="nav-link" href="#play">Back to battle</a>
        </div>
        <div id="gallery-game" aria-label="King of the Reef fish gallery"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
